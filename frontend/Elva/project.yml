name: Elva
options:
  bundleIdPrefix: ru.elva
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "Z3PM3LR5FF"
    CODE_SIGN_STYLE: Automatic
targets:
  Elva:
    type: application
    platform: iOS
    configFiles:
      Debug: Configs/Dev.xcconfig
      Release: Configs/Prod.xcconfig
    sources:
      - Elva
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.elva.app
        INFOPLIST_FILE: Elva/Info.plist
        CODE_SIGN_ENTITLEMENTS: Elva/Elva.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ElvaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ElvaUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Elva
  ElvaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ElvaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Elva
schemes:
  Elva:
    build:
      targets:
        Elva: all
    test:
      targets:
        - ElvaTests
        - ElvaUITests
